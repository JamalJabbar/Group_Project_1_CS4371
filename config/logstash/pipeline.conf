input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["topic2"]
    group_id => "cs4371-entity-counts"
    auto_offset_reset => "earliest"
    codec => json
  }
}

filter {
  if ![run_id] {
    mutate { add_field => { "run_id" => "default" } }
  }
  if ![entity] or ![count] or [run_id] !~ /^[a-z0-9][a-z0-9-]{0,49}$/ {
    drop { }
  }
  fingerprint {
    source => ["entity"]
    method => "SHA256"
    target => "[@metadata][entity_id]"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cs4371-entities-%{[run_id]}"
    document_id => "%{[@metadata][entity_id]}"
    action => "index"
  }
}
